[project]
name = "titanic-rnd"
version = "0.1.0"
description = "Reproducible Titanic survival prediction experiments"
readme = "README.md"
requires-python = "==3.14.10"
dependencies = [
    "joblib>=1.6.0,<2",
    "matplotlib>=3.11.2,<4",
    "mlflow==3.18.0",
    "numpy>=2.5.4,<3",
    "pandas>=3.1.1,<4",
    "pyyaml>=6.0.3,<7",
    "scikit-learn>=1.9.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
]

[tool.uv]
package = false
required-version = ">=0.13.8"
