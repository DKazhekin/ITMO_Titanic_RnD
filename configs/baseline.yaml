seed: 42
features:
  numeric: [Age, Fare, SibSp, Parch]
  categorical: [Sex, Pclass, Embarked]
validation:
  outer_splits: 5
  test_fold: 0
  inner_splits: 5
model:
  l1_ratio: 0.0
  solver: lbfgs
  fit_intercept: true
  max_iter: 1000
  tol: 0.0001
search:
  C: [0.01, 0.1, 1.0, 10.0, 100.0]
  class_weight: [null, balanced]
prediction:
  threshold: 0.5
bootstrap:
  n_resamples: 2000
  confidence_level: 0.95
