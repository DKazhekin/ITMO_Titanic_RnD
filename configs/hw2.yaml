seed: 42
features:
  numeric: [Age, Fare, SibSp, Parch]
  categorical: [Sex, Pclass, Embarked]
validation:
  outer_splits: 5
  test_fold: 0
  inner_splits: 5
model:
  l1_ratio: 0.0
  solver: lbfgs
  fit_intercept: true
  max_iter: 1000
  tol: 0.0001
# One previously selected configuration; no hyperparameter search is performed.
search:
  C: [1.0]
  class_weight: [null]
prediction:
  threshold: 0.5
threshold_search:
  candidates: unique_validation_probabilities_plus_0_0.5_1
  objective: unweighted_mean_fold_balanced_accuracy
  comparison: strict_greater
  ties: closest_to_0.5_then_lower
bootstrap:
  n_resamples: 2000
  confidence_level: 0.95
tracking:
  experiment: titanic-hw2
  directory: artifacts/mlflow
variants:
  - id: baseline
    interaction: false
    tune_threshold: false
    hypothesis: Reproduce the original logistic regression with its selected settings.
  - id: interaction
    interaction: true
    tune_threshold: false
    hypothesis: Different age slopes for male and female passengers may improve balanced accuracy.
  - id: threshold
    interaction: false
    tune_threshold: true
    hypothesis: A common validation-selected threshold may improve the balance of class recalls.
  - id: full
    interaction: true
    tune_threshold: true
    hypothesis: Combine age-by-sex interaction with a threshold selected for that feature set.
